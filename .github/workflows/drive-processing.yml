name: Rebuild dashboard from Drive exports

on:
  push:
    branches: [drive_processing]
    paths:
      - 'drive_data/**/manifest.json'
      - 'manual_csv/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drive-processing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: drive_processing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install workbook importer
        run: python -m pip install openpyxl
      - name: Import high-frequency workbook and Big Data territories
        run: |
          if [ -f drive_data/high_frequency/alta_frecuencia.xlsx ] && [ -f drive_data/bigdata/Datos_informe.csv ]; then
            python importar_bigdata.py drive_data/high_frequency/alta_frecuencia.xlsx
            python importar_bigdata_drive.py
            python generar_heatmap.py
          else
            echo 'Drive source exports are not present yet; keeping the checked-in snapshot.'
          fi
      - name: Rebuild dashboard HTML
        run: python build_page.py
      - name: Commit generated dashboard data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bigdata.json bigdata_geo bigdata_heatmap.json espana.html artifact.html
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git commit -m 'Build dashboard from Drive exports'
          git fetch origin drive_processing
          git rebase origin/drive_processing
          git push origin HEAD:drive_processing
