name: Build Drive dashboard preview

on:
  push:
    branches: [drive_processing]
    paths:
      - 'drive_data/**'
      - 'manual_csv/**'
      - 'turkey_csv/**'
      - 'importar_bigdata.py'
      - 'importar_bigdata_drive.py'
      - 'importar_tabla_monitor.py'
      - 'generar_heatmap.py'
      - 'build_page.py'
      - 'template.html'
      - 'data.json'
      - 'forecasts.json'
      - '.github/workflows/drive-processing.yml'

permissions:
  contents: read

concurrency:
  group: drive-processing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Import Drive exports and build dashboard
        run: |
          if [ -f drive_data/manual/alta_frecuencia.xlsx ]; then
            python -m pip install openpyxl
            python importar_bigdata.py drive_data/manual/alta_frecuencia.xlsx --manual
          fi
          if [ -f drive_data/bigdata/Tabla_monitor.csv ]; then
            python importar_tabla_monitor.py
          fi
          if [ -f drive_data/bigdata/Datos_informe.csv ]; then
            python importar_bigdata_drive.py
          fi
          if [ -f bigdata_geo/index.json ] || [ -f drive_data/bigdata/Tabla_monitor.csv ]; then
            python generar_heatmap.py
          fi
          python build_page.py
      - name: Upload dashboard preview
        uses: actions/upload-artifact@v4
        with:
          name: drive-dashboard-preview
          if-no-files-found: error
          path: |
            artifact.html
            espana.html
            index.html
            pais.html
            usa.html
            i18n.js
            bbva-research-logo.png
            bigdata.json
            bigdata_geo/
            bigdata_heatmap.json
            data.json
            forecasts.json
            frbus_resultados.json
            gdpnow.json
            gdpnow_tracking.json
            manual_workbook.json
            manual_csv/*.csv
            manual_csv/manifest.json
            turkey_csv/*.csv
            turkey_csv/manifest.json
