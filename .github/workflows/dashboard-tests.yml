name: Dashboard tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run unit tests
        run: node --test
      - name: Check generated pages
        run: |
          python build_page.py
          git diff --exit-code -- artifact.html espana.html turquia.html usa.html
      - name: Install Chromium
        run: |
          python -m pip install playwright==1.65.2
          python -m playwright install --with-deps chromium --only-shell
      - name: Run browser tests
        shell: bash
        run: |
          log="$RUNNER_TEMP/dashboard-browser-tests.log"
          if python -B -m unittest discover -s tests -v 2>&1 | tee "$log"; then
            exit 0
          fi
          awk '/^(FAIL|ERROR): |^AssertionError:|^playwright\..*Error:/ {
            gsub(/%/, "%25")
            print "::error::" $0
          }' "$log"
          exit 1
