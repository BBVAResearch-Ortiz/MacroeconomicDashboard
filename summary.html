<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Summary &amp; Forecasts · Monitor macroeconómico</title><style>
:root{--blue:#001391;--midnight:#060e46;--text:#000519;--muted:#46536d;--line:#dce3eb;--sand:#f7f8f8;--light:#85c8ff}*{box-sizing:border-box}body{margin:0;color:var(--text);font-family:'IBM Plex Sans',system-ui,-apple-system,sans-serif;background:#fff}header{border-bottom:1px solid var(--line)}.wrap{max-width:1180px;margin:auto;padding:0 28px}.top{padding-top:30px;padding-bottom:24px;display:flex;justify-content:space-between;gap:16px;align-items:center}.brand{display:block;line-height:0}.brand img{display:block;width:155px;height:auto;max-width:100%}.section{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}main{padding:68px 0 88px}.eyebrow{font-size:12px;letter-spacing:.13em;text-transform:uppercase;color:var(--blue);font-weight:700;margin:0 0 12px}h1{font-family:Georgia,serif;font-size:clamp(22px,3.8vw,46px);line-height:1.12;color:var(--blue);font-weight:600;white-space:nowrap;margin:0;overflow-x:auto}p.lead{font-size:18px;color:var(--muted);margin:20px 0 48px;max-width:670px}.label{font-size:13px;font-weight:600;color:var(--muted);padding-bottom:14px;border-bottom:1px solid var(--line);margin:0 0 20px}.grid{display:flex;flex-direction:column;gap:16px;padding-bottom:8px}.tile-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.tile-row.three{grid-template-columns:repeat(4,minmax(0,1fr))}.card{display:flex;flex-direction:column;justify-content:space-between;text-decoration:none;background:var(--sand);color:var(--midnight);border:1px solid #e5eaf0;min-height:150px;padding:18px;transition:border-color .15s,background .15s}.card.featured{background:#fff1e3;border-color:#f4c69a}.card.featured:hover,.card.featured:focus-visible{background:#ffe4c8;border-color:#d8732a}.card.featured.featured-green{background:#e8f6e8;border-color:#b8dcb9}.card.featured.featured-green:hover,.card.featured.featured-green:focus-visible{background:#d8efda;border-color:#48965b}.card:hover,.card:focus-visible{border-color:var(--blue);background:#eef5ff;outline:2px solid transparent}.card-top{display:flex;justify-content:space-between;align-items:start;gap:20px}.country{font-family:Georgia,serif;font-weight:600;font-size:clamp(21px,2.2vw,27px);overflow-wrap:anywhere;line-height:1.2;color:var(--blue)}.arrow{font-size:24px;line-height:1;color:var(--blue)}.status{font-size:13px;color:var(--muted)}footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding:25px 0}@media(max-width:760px){main{padding-top:44px}.tile-row,.tile-row.three{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.section{text-align:right}}@media(max-width:460px){.card{min-height:120px}.wrap{padding-left:20px;padding-right:20px}}
 .language{display:flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:4px;overflow:hidden}.language button{font:600 12px system-ui;padding:7px 12px;border:0;background:#fff;color:var(--muted);cursor:pointer}.language button[aria-pressed="true"]{background:var(--blue);color:white}.head-right{display:flex;align-items:center;gap:20px}.refresh-area{text-align:right}.refresh-controls{display:flex;justify-content:flex-end;align-items:center;gap:10px}.refresh-button{background:#001391;color:white;border:0;border-radius:6px;padding:9px 16px;font:600 13px system-ui;cursor:pointer}.refresh-button:disabled{opacity:.65;cursor:wait}.refresh-stamp,.refresh-message{font:12px system-ui;color:#46536d;margin-top:7px}.refresh-stamp{font-family:ui-monospace,monospace}@media(max-width:600px){.head-right{flex-direction:column;align-items:flex-end;gap:8px}.section{font-size:10px}.refresh-controls{gap:5px}.refresh-button{padding:8px;font-size:12px}.refresh-stamp,.refresh-message{font-size:10px}}
.crumb{display:inline-block;color:var(--blue);text-decoration:none;font-size:14px;font-weight:600;margin-bottom:22px}
h1{white-space:normal}
p.lead{margin-bottom:28px}
.caps{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 26px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.caps button,.geos button{font:600 14px 'IBM Plex Sans',system-ui,sans-serif;border:0;border-radius:999px;padding:10px 18px;background:#F3F5F6;color:var(--blue);cursor:pointer}
.geos{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}
.geos button{font-size:13px;padding:8px 12px;border-radius:7px}
.caps button[aria-selected="true"],.geos button[aria-pressed="true"]{background:var(--blue);color:#fff}
.caps button:focus-visible,.geos button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panel-card{border:1px solid var(--line);border-radius:14px;padding:22px 24px;background:#fff;margin-bottom:20px}
.panel-card h2{font-family:Georgia,serif;font-size:22px;color:var(--midnight);margin:0 0 4px}
.panel-card .sub{font-size:13px;color:var(--muted);margin:0 0 14px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid #eef1f5;white-space:nowrap}
th:first-child,td:first-child{text-align:left;white-space:normal;min-width:180px}
thead th{font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line)}
thead .group th{text-align:center;color:var(--midnight);border-bottom:0;padding-bottom:2px}
thead .group th:first-child{text-align:left}
tbody th{font-weight:600;color:var(--midnight)}
td.f,th.f{background:#F7F9FC}
td.sep,th.sep{border-left:1px solid var(--line)}
.risk{display:inline-block;inline-size:1.1em;text-align:center;font-size:11px;margin-inline-start:4px}
.risk.U{color:#1f7a3d}.risk.D{color:#b3261e}.risk.N{color:#8a94a6}
.risk-word{font-size:12px;color:var(--muted)}
.risk-word.U{color:#1f7a3d}.risk-word.D{color:#b3261e}
.key{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;color:var(--muted);margin:12px 0 0}
.note{font-size:12px;color:var(--muted);margin:10px 0 0;max-width:820px}
.note a{color:var(--blue)}
[hidden]{display:none!important}
@media(max-width:760px){.panel-card{padding:16px}table{font-size:13px}}</style></head><body>

 en:{section:'Macroeconomic dashboard',back:'← Back to home',eyebrow:'BBVA Research · Macroeconomic dashboard',lead:'Cross-country summary and BBVA Research forecasts by geography.',
  summary:'Summary',forecasts:'Forecasts',caps:'Sections',sumTitle:'Forecast summary by geography',sumSub:'Growth, inflation and policy rate. Shaded columns are forecasts.',

  key:'Balance of risks of each forecast:',infNote:'End-of-period inflation; Q4/Q4 for the United States. Spain has no policy rate of its own (ECB). “—” means the source does not publish the figure.',

const years=DATA.years, isF=y=>y>=DATA.forecast_from, yl=y=>y+(isF(y)?' '+T[lang].forecast:'');
function summaryTable(){ const t=T[lang], cols=years.slice(1), tags=['gdp','inf','rate'];
  const head=`<tr class="group"><th></th>${tags.map(k=>`<th class="sep" colspan="${cols.length}">${t[k]}</th>`).join('')}</tr><tr><th>${t.geo}</th>${tags.map(()=>cols.map((y,i)=>`<th class="${isF(y)?'f':''}${i?'':' sep'}">${yl(y)}</th>`).join('')).join('')}</tr>`;
  const body=DATA.geos.map(g=>`<tr data-geo="${g.id}"><th scope="row">${esc(g[lang])}</th>${tags.map(k=>{ const row=g.rows.find(r=>r.tag===k);

  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`; }
function detailTable(rowsData,nameLabel,withDate){ const t=T[lang];
  const head=`<tr><th>${nameLabel}</th>${years.map(y=>`<th class="${isF(y)?'f':''}">${yl(y)}</th>${isF(y)?`<th class="f">${t.balance}</th>`:''}`).join('')}${withDate?`<th>${t.date}</th>`:''}</tr>`;

  return `<table><thead>${head}</thead><tbody>${body}</tbody></table>`; }
function render(){ const t=T[lang]; document.documentElement.lang=lang; document.title=t.title;

  try{localStorage.setItem('mme-lang',lang)}catch(e){} }
